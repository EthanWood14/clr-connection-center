  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Product metadata is switched synchronously for direct LAP/recovery loads. -->
    <link rel="icon" href="./favicon-32.png" type="image/png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon-512.png" />

    <!-- iOS / Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" type="image/png" />
    <link rel="mask-icon" href="./logo-white.svg" color="#3e5379" />

    <!-- PWA -->
    <link rel="manifest" />
    <meta name="theme-color" content="#3e5379" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WCLCC" />
    <meta name="application-name" content="WCLCC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#3e5379" />
    <meta name="msapplication-TileImage" content="./favicon-192.png" />
    <title>WCLCC</title>
    <script>
      (() => {
        const hash = window.location.hash || "";
        const hashQuery = hash.includes("?") ? hash.slice(hash.indexOf("?") + 1) : "";
        const lap = /^#\/lap(?:\/|$|\?)/i.test(hash)
          || new URLSearchParams(window.location.search).get("portal")?.toLowerCase() === "lap"
          || new URLSearchParams(hashQuery).get("portal")?.toLowerCase() === "lap";
        document.documentElement.classList.toggle("lap-mode", lap);
        try {
          const stored = localStorage.getItem(lap ? "lap.theme" : "theme");
          const dark = stored === "dark"
            || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
        const setLink = (selector, attributes) => {
          const link = document.head.querySelector(selector);
          if (!link) return;
          for (const [name, value] of Object.entries(attributes)) {
            if (value == null) link.removeAttribute(name);
            else link.setAttribute(name, value);
          }
        };
        const setMeta = (name, content) => {
          const meta = document.head.querySelector(`meta[name="${name}"]`);
          if (meta) meta.content = content;
        };
        setLink('link[rel="manifest"]', { href: lap ? "/manifest-lap.json" : "/manifest.json" });
        if (lap) {
          setLink('link[rel="icon"]:not([sizes])', { href: "/lap-icon-192.png" });
          setLink('link[rel="icon"][sizes="192x192"]', { href: "/lap-icon-192.png" });
          setLink('link[rel="icon"][sizes="512x512"]', { href: "/lap-icon-512.png" });
          setLink('link[rel="apple-touch-icon"]', { href: "/lap-icon-180.png" });
          setLink('link[rel="mask-icon"]', { href: "/lap-icon.svg", color: "#6E1F2B" });
          setMeta("theme-color", "#3B111A");
          setMeta("apple-mobile-web-app-title", "LAP");
          setMeta("application-name", "LAP");
          setMeta("msapplication-TileColor", "#3B111A");
          setMeta("msapplication-TileImage", "/lap-icon-192.png");
        }
        document.title = lap ? "LAP · LO Assistant Portal" : "WCLCC";
      })();
    </script>
