name: Apply Call-vs-Shotgun storage patch
on:
  push:
    branches: [fix/lo-new-lead-call-shotgun-race]
    paths:
      - patches/lo-new-lead-call-shotgun-race.patch
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lo-new-lead-call-shotgun-race
      - name: Apply patch if still needed
        run: |
          set -e
          if grep -q lo-new-lead-escalation server/storage.ts; then
            echo "storage already wired; skipping patch"
            exit 0
          fi
          patch -p1 < patches/lo-new-lead-call-shotgun-race.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/storage.ts shared/release-notes.ts
          git commit -m "Apply Call vs Shotgun race fix (storage take-before-publish)"
          git push
