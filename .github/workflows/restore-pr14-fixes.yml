name: restore-pr14-fixes

on:
  push:
    branches:
      - feature/retail-meta-shotgun-immediate
    paths:
      - ".github/workflows/restore-pr14-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retail-meta-shotgun-immediate
          fetch-depth: 0

      - name: Restore watcher body from last good commit
        run: git show e219973733149a5ebf70158adeeab0f7f0fbfb79:server/retail-bonzo-shotgun-watcher.ts > server/retail-bonzo-shotgun-watcher.ts

      - name: Commit and push watcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/retail-bonzo-shotgun-watcher.ts
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "fix: restore retail-bonzo-shotgun-watcher.ts from pre-PLACEHOLDER commit"
          git push origin HEAD:feature/retail-meta-shotgun-immediate
